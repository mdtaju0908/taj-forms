services:
  - type: web
    name: taj-forms-api
    runtime: node
    rootDir: taj-forms/backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /forms/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: taj_forms
      - key: ALLOWED_ORIGINS
        value: https://mdtaju.tech,https://admin.mdtaju.tech
      - key: PUBLIC_APP_URL
        value: https://mdtaju.tech/forms
      - key: ADMIN_APP_URL
        value: https://admin.mdtaju.tech/forms
